name: Push
on:
  push:
    branches: [main]

# Prevent concurrent runs on the same branch. In case of conflict,
# the oldest run will be cancelled.
concurrency:
  group: ${{ github.workflow }}-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Docker registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # By default, the context is the git context. Set it to the current
          # directory to include make sure `.git` directory is available.
          context: .
          platforms: linux/arm64/v8
          tags: ${{ secrets.REGISTRY_URL }}/anacounts:latest
